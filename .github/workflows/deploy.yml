name: Deploy to GitHub Pages

on:
  # Deploy whenever the main branch is updated.
  push:
    branches: [main]
  # Allow running it manually from the repository's Actions tab.
  workflow_dispatch:

# Only the permissions GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` type-checks (tsc) and then builds with Vite into ./dist.
      # VITE_REPO_NAME makes Vite use /<repository-name>/ as the site's base path,
      # so renaming the repository never requires a code change.
      - name: Build
        run: npm run build
        env:
          VITE_REPO_NAME: ${{ github.event.repository.name }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
